[package]
name = "mellowyak-desktop"
version = "0.1.0"
description = "MellowYak local-first desktop shell"
authors = ["MellowYak contributors"]
edition = "2021"

[lib]
name = "mellowyak_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
